              if (activePt) {
                var dec = evaluateBedAngleProtocol(activePt.inputs);
                var revT = dec.reverseTrendelenburgDeg > 0 && state.plannedHobInput === 0 ? dec.reverseTrendelenburgDeg : 0;
                handleApplyAngleForPatient(activePt, state.plannedHobInput, revT, undefined, { allowUndo: true });
              }
              break;

            case 'ws-planned-quick':
              state.plannedHobInput = Number(btn.getAttribute('data-deg') || 0);
              renderApp();
              break;

            case 'toggle-show-visuals':
              state.showVisuals = !state.showVisuals;
              renderApp();
              break;

            case 'toggle-more-details':
              state.showMoreDetails = !state.showMoreDetails;
              renderApp();
              break;

            case 'trigger-critical-demo':
              triggerCriticalDemo();
              break;

            case 'set-reposition-interval':
              if (activePt) {
                updatePatient(Object.assign({}, activePt, {
                  customRepositionIntervalMin: Number(btn.getAttribute('data-mins') || 120),
                }));
                commitAndRender();
              }
              break;

            case 'reset-reposition-interval':
              if (activePt) {
                updatePatient(Object.assign({}, activePt, { customRepositionIntervalMin: null }));
                commitAndRender();
              }
              break;

            // Quick reposition bar actions
            case 'quick-tilt':
              if (activePt) {
                var qt = btn.getAttribute('data-tilt');
                if (qt) applyLateralTiltForPatient(activePt, qt);
              }
              break;

            case 'toggle-angle-drawer':
              state.angleDrawerOpen = !state.angleDrawerOpen;
              renderApp();
              break;

            case 'quick-bar-angle':
              if (activePt) {
                var qd = Number(btn.getAttribute('data-deg') || 30);
                handleApplyAngleForPatient(activePt, qd, 0, undefined, { allowUndo: true });
                state.angleDrawerOpen = false;
                renderApp();
              }
              break;

            // Practice tools drawer actions
            case 'open-practice-drawer':
              state.practiceOpen = true;
              renderApp();
              break;

            case 'close-practice-drawer':
              state.practiceOpen = false;
              renderApp();
              break;

            case 'practice-tab':
              state.practiceTab = btn.getAttribute('data-tab') || 'scenario_response';
              renderApp();
              break;

            case 'practice-preset': {
              var prId = btn.getAttribute('data-preset-id');
              for (var pIdx = 0; pIdx < PRACTICE_SCENARIO_PRESETS.length; pIdx++) {
                if (PRACTICE_SCENARIO_PRESETS[pIdx].id === prId) {
                  handleApplyPresetFromPractice(PRACTICE_SCENARIO_PRESETS[pIdx]);
                  break;
                }
              }
              break;
            }

            case 'practice-notify-doctor':
              if (activePt) handleNotifyDoctorCritical(activePt, true);
              break;

            case 'practice-recheck-submit':
              if (activePt) {
                var pm = btn.getAttribute('data-mode') === 'unchanged' ? 'unchanged' : 'manual';
                handleSubmitCriticalRecheck(activePt, pm, state.recheckInputs, true);
              }
              break;

            case 'try-angle-preset':
              state.tryAngle = Number(btn.getAttribute('data-deg') || 0);
              renderApp();
              break;

            case 'try-duration':
              state.tryDurationMin = Number(btn.getAttribute('data-mins') || 60);
              renderApp();
              break;

            case 'mission-choice':
              if (state.selectedChoiceIdx === null) {
                var cIdx = Number(btn.getAttribute('data-idx'));
                var mc = MISSION_CASES[state.missionIndex] || MISSION_CASES[0];
                var mAudit = checkAngleAppropriateness(mc.inputs.currentHob, mc.inputs);
                var mRecHob = mAudit.targetRevTilt > 0 ? 0 : mAudit.targetHob;
                var mRecRev = mAudit.targetRevTilt;
                var chosen = mc.choices[cIdx];
                state.selectedChoiceIdx = cIdx;
                if (chosen) {
                  var ok = chosen.hob === mRecHob && (chosen.revTilt || 0) === mRecRev;
                  state.missionScore = {
                    correct: state.missionScore.correct + (ok ? 1 : 0),
                    total: state.missionScore.total + 1,
                  };
                }
                renderApp();
              }
              break;

            case 'mission-next':
              state.missionIndex = (state.missionIndex + 1) % MISSION_CASES.length;
              state.selectedChoiceIdx = null;
              renderApp();
              break;

            // AngleMatrix / EMR Records / PRD actions
            case 'matrix-filter':
              state.matrixFilter = btn.getAttribute('data-filter') || 'all';
              renderApp();
              break;

            case 'emr-download-csv':
              downloadCsv(getFilteredEmrRecords());
              break;

            case 'toggle-emr-episode': {
              var rId = btn.getAttribute('data-rec-id');
              if (rId) {
                state.expandedEpisodeIds = Object.assign({}, state.expandedEpisodeIds);
                state.expandedEpisodeIds[rId] = !state.expandedEpisodeIds[rId];
                renderApp();
              }
              break;
            }

            case 'prd-scroll': {
              var secId = btn.getAttribute('data-sec-id');
              if (secId) {
                state.prdActiveId = secId;
                renderApp();
                var secEl = document.getElementById('prd-' + secId);
                if (secEl && secEl.scrollIntoView) {
                  secEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
              }
              break;
            }

            case 'prd-copy':
              copyPrdMarkdown();
              break;

            case 'prd-download':
              downloadPrdFile();
              break;

            // Toast actions
            case 'toast-undo':
              if (state.toastState && state.toastState.onUndo) {
                var fn = state.toastState.onUndo;
                if (toastTimerId) {
                  window.clearTimeout(toastTimerId);
                  toastTimerId = null;
                }
                state.toastState = null;
                fn();
              }
              break;

            case 'toast-close':
              if (toastTimerId) {
                window.clearTimeout(toastTimerId);
                toastTimerId = null;
              }
              state.toastState = null;
              renderApp();
              break;
          }
        });

        // Smooth input handler (preserves text focus & range dragging)
        appEl.addEventListener('input', function (e) {
          var el = e.target;
          if (!el || !el.getAttribute) return;
          var action = el.getAttribute('data-action');
          if (!action) return;

          if (action === 'alert-order-note-input') {
            var pid = el.getAttribute('data-patient-id');
            if (pid) {
              var d = state.orderDrafts[pid] || { note: '', hob: null };
              state.orderDrafts[pid] = { note: el.value, hob: d.hob };
            }
          } else if (action === 'ws-order-note-input') {
            state.orderNoteInput = el.value;
          } else if (action === 'custom-hold-reason-input') {
            state.customHoldReason = el.value;
          } else if (action === 'prd-search-input') {
            state.prdQuery = el.value;
            renderApp();
          } else if (action === 'newbed-field') {
            var nf = el.getAttribute('data-field');
            if (nf) {
              if (el.type === 'number') {
                if (el.value !== '' && !isNaN(Number(el.value))) {
                  state.newBedDraft[nf] = Number(el.value);
                }
              } else {
                state.newBedDraft[nf] = el.value;
              }
            }
          } else if (action === 'alert-recheck-field') {
            var apid = el.getAttribute('data-patient-id');
            var af = el.getAttribute('data-field');
            if (apid && af && el.value !== '' && !isNaN(Number(el.value))) {
              if (!state.recheckDrafts[apid]) {
                var ap = findPatientById(apid);
                state.recheckDrafts[apid] = ap
                  ? { rr: ap.inputs.rr, hr: ap.inputs.hr, spo2: ap.inputs.spo2 }
                  : { rr: 18, hr: 80, spo2: 96 };
              }
              state.recheckDrafts[apid][af] = Number(el.value);
            }
          } else if (action === 'ws-recheck-field') {
            var wf = el.getAttribute('data-field');
            if (wf && el.value !== '' && !isNaN(Number(el.value))) {
              state.recheckInputs[wf] = Number(el.value);
            }
          } else if (action === 'vital-field') {
            var vf = el.getAttribute('data-field');
            var activePt = getActivePatient();
            if (vf && activePt && el.value !== '' && !isNaN(Number(el.value))) {
              var num = Number(el.value);
              var slider = document.querySelector('[data-action="vital-slider"][data-field="' + vf + '"]');
              if (slider) slider.value = String(num);
              activePt.inputs[vf] = num;
            }
          } else if (action === 'vital-slider') {
            var sf = el.getAttribute('data-field');
            var numVal = Number(el.value);
            var numBox = document.querySelector('[data-action="vital-field"][data-field="' + sf + '"]');
            if (numBox) numBox.value = String(numVal);
          } else if (action === 'ws-planned-slider') {
            var ph = Number(el.value);
            state.plannedHobInput = ph;
            var lbl = document.querySelector('[data-role="ws-planned-label"]');
            if (lbl) lbl.textContent = '적용 각도 (' + ph + '°):';
            var btnEl = document.querySelector('[data-role="ws-apply-angle-btn"]');
            if (btnEl) btnEl.textContent = ph + '° 적용';
          } else if (action === 'try-angle-slider') {
            var ta = Number(el.value);
            state.tryAngle = ta;
            var tLbl = document.querySelector('[data-role="try-angle-label"]');
            if (tLbl) tLbl.textContent = ta + '°';
            var tPrev = document.querySelector('[data-role="try-angle-preview"]');
            if (tPrev) tPrev.innerHTML = renderTryAnglePreviewHtml(getActivePatient());
          }
        });

        // Commit handler for sliders, number fields, selects, and checkboxes
        appEl.addEventListener('change', function (e) {
          var el = e.target;
          if (!el || !el.getAttribute) return;
          var action = el.getAttribute('data-action');
          if (!action) return;

          var activePt = getActivePatient();
          var pid = el.getAttribute('data-patient-id');
          var targetPt = pid ? findPatientById(pid) : activePt;

          if (action === 'toggle-safety-confirm') {
            if (targetPt) handleToggleSafetyConfirmed(targetPt, Boolean(el.checked));
          } else if (action === 'vital-slider') {
            var sf = el.getAttribute('data-field');
            if (sf) handleUpdateField(sf, Number(el.value));
          } else if (action === 'vital-field') {
            var vf = el.getAttribute('data-field');
            if (vf && activePt) {
              var bounds = { rr: [6, 38], hr: [38, 150], spo2: [80, 100], sbp: [60, 220], dbp: [30, 140], borgScore: [0, 10], painNrs: [0, 10] }[vf] || [0, 250];
              handleUpdateField(vf, clampNum(el.value, bounds[0], bounds[1], activePt.inputs[vf]));
            }
          } else if (action === 'vital-skin') {
            handleUpdateField('sacralSkinStatus', el.value);
          } else if (action === 'vital-check') {
            var cf = el.getAttribute('data-field');
            if (cf) handleUpdateField(cf, Boolean(el.checked));
          } else if (action === 'ws-planned-slider') {
            state.plannedHobInput = Number(el.value);
            renderApp();
          } else if (action === 'try-angle-slider') {
            state.tryAngle = Number(el.value);
            renderApp();
          } else if (action === 'reposition-interval-input') {
            if (activePt) {
              var curInt = activePt.customRepositionIntervalMin || getDefaultRepositionInterval(activePt.inputs);
              var clampedInt = clampNum(el.value, 15, 240, curInt);
              updatePatient(Object.assign({}, activePt, { customRepositionIntervalMin: clampedInt }));
              commitAndRender();
            }
          } else if (action === 'emr-bed-filter') {
            state.emrBedFilter = el.value;
            renderApp();
          } else if (action === 'emr-period-filter') {
            state.emrPeriodFilter = el.value;
            renderApp();
          } else if (action === 'toggle-delete-with-records') {
            state.deleteWithRecords = Boolean(el.checked);
            renderApp();
          } else if (action === 'newbed-check') {
            var ncf = el.getAttribute('data-field');
            if (ncf) state.newBedDraft[ncf] = Boolean(el.checked);
          } else if (action === 'newbed-field' && el.type === 'number') {
            var nf = el.getAttribute('data-field');
            var nb = { rr: [6, 40], hr: [35, 160], spo2: [75, 100], sbp: [60, 220], dbp: [30, 140], currentHob: [0, 90] }[nf] || [0, 250];
            if (nf) state.newBedDraft[nf] = clampNum(el.value, nb[0], nb[1], state.newBedDraft[nf]);
          }
        });

        appEl.addEventListener('submit', function (e) {
          var form = e.target;
          if (form && form.id === 'new-bed-form') {
            e.preventDefault();
            handleCreatePatientFromModal();
          }
        });

        appEl.addEventListener('mouseover', function (e) {
          var g = e.target && e.target.closest ? e.target.closest('g[data-chart-idx]') : null;
          if (!g) return;
          var activeTag = document.activeElement ? document.activeElement.tagName : '';
          if (activeTag === 'INPUT' || activeTag === 'SELECT') return;
          var idx = Number(g.getAttribute('data-chart-idx'));
          if (!isNaN(idx) && state.hoverChartIdx !== idx) {
            state.hoverChartIdx = idx;
            renderApp();
          }
        });

        appEl.addEventListener('mouseout', function (e) {
          var svg = e.target && e.target.closest ? e.target.closest('svg[data-action="chart-svg"]') : null;
          if (!svg) return;
          var related = e.relatedTarget;
          if (related && svg.contains && svg.contains(related)) return;
          if (state.hoverChartIdx !== null) {
            state.hoverChartIdx = null;
            var activeTag = document.activeElement ? document.activeElement.tagName : '';
            if (activeTag !== 'INPUT' && activeTag !== 'SELECT') {
              renderApp();
            }
          }
        });

        document.addEventListener('mousedown', function (e) {
          if (state.openCardMenuId) {
            var inside = e.target && e.target.closest ? e.target.closest('[data-card-menu-root="true"]') : null;
            if (!inside) {
              state.openCardMenuId = null;
              renderApp();
            }
          }
        });

        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') {
            var dirty = false;
            if (state.openCardMenuId) { state.openCardMenuId = null; dirty = true; }
            if (state.deleteTargetPatient) { state.deleteTargetPatient = null; dirty = true; }
            else if (state.resetConfirmOpen) { state.resetConfirmOpen = false; dirty = true; }
            else if (state.isNewBedOpen) { state.isNewBedOpen = false; dirty = true; }
            else if (state.practiceOpen) { state.practiceOpen = false; dirty = true; }
            if (dirty) renderApp();
          }
        });

        window.addEventListener('resize', function () {
          syncMeasuredLayoutHeights();
        });

        // Initial render
        renderApp();
      })();
    </script>
  </body>
</html>
