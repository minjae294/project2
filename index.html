              pressureLine: '체중이 고르게 퍼져 엉치뼈 집중 압력은 적지만, 콧줄 식사·숨찬 환자는 역류와 폐렴 위험이 커집니다.',
              longDurationWarning: durationMin >= 60
                ? '주의: 0° 자세를 ' + (durationMin >= 60 ? (durationMin / 60) + '시간' : durationMin + '분') + ' 유지하면 폐 압박, 숨참 악화, 위 내용물 역류(흡인성 폐렴) 위험이 커집니다.'
                : null,
            };
          }
          if (angle < 30) {
            return {
              zoneLabel: '15~30° 구간',
              zoneTitle: '조금 세운 자세 (낮은 반앉기)',
              respirationLine: '횡격막이 아래로 내려가 0°보다 숨쉬기가 편해지고, 누웠을 때의 사레들림 위험을 줄여줍니다.',
              pulseLine: '심장 부담이 줄고 안정 신경이 작동해 맥박과 혈압이 비교적 편안하게 유지됩니다.',
              pressureLine: '엉치뼈 눌림은 적은 편이나, 콧줄 식사 시에는 역류 예방을 위해 최소 30° 이상이 안전합니다.',
              longDurationWarning: durationMin >= 120
                ? '주의: 한 자세로 ' + (durationMin / 60) + '시간 이상 유지하면 엉치뼈·등 부위 압력이 쌓이므로 체위변경(몸 돌리기)이 필요합니다.'
                : null,
            };
          }
          if (angle < 60) {
            var isMid = angle > 45;
            return {
              zoneLabel: !isMid ? '30~45° 구간' : '45~60° 적응 구간',
              zoneTitle: !isMid ? '반쯤 앉은 자세 (반좌위 기본 표준)' : '중간 높이 앉은 자세 (고각도 적응 단계)',
              respirationLine: !isMid
                ? '가슴이 잘 열려 숨찬 환자에게 가장 표준이 되며, 역류와 흡인성 폐렴을 가장 효과적으로 막아줍니다.'
                : '30~45°보다 폐 아래 공간을 한 번 더 넓혀주어 중간 이상의 숨참을 덜어주는 안전 확인 단계입니다.',
              pulseLine: !isMid

                : '피가 다리 쪽으로 내려가기 시작하므로 어지럼증이나 혈압 하락, 맥박 상승이 없는지 확인해야 합니다.',

              longDurationWarning: isMid && durationMin >= 60
                ? '주의: 45° 초과 각도를 ' + (durationMin >= 60 ? (durationMin / 60) + '시간' : durationMin + '분') + ' 유지하면 엉치뼈 전단력·욕창 위험(60분 가정값)이 급격히 커집니다.'
                : durationMin >= 120
                  ? '주의: ' + (durationMin / 60) + '시간 유지 시 체위변경(몸 돌리기) 간격(120분)에 맞춰 왼쪽·정면·오른쪽으로 자세를 바꿔주세요.'
                  : null,

          }
          return {
            zoneLabel: '60~90° 구간',
            zoneTitle: '높이 앉은 자세 (급성 호흡곤란 완화)',
            respirationLine: '가슴이 완전히 열리고 중력이 배 속 장기를 아래로 당겨 폐 바닥까지 공기가 가장 잘 들어갑니다.',
            pulseLine: '피가 다리로 쏠려 맥박이 빨라지거나 갑자기 혈압이 떨어지는(기립성 저혈압) 현상을 주의해야 합니다.',
            pressureLine: '체중이 엉치뼈에 강하게 쏠려 욕창 위험이 매우 크므로 무릎 받침을 올리고 숨이 가라앉으면 30~45°로 낮춰야 합니다.',
            longDurationWarning: durationMin >= 60
              ? '강한 주의: ' + angle + '° 높은 각도를 ' + (durationMin >= 60 ? (durationMin / 60) + '시간' : durationMin + '분') + ' 유지하면 기립성 저혈압·어지럼증·피로와 심각한 엉치뼈 욕창 위험이 커집니다.'
              : '주의: 60° 이상 고각도는 30~60분 단위로 혈압·맥박과 엉치뼈 피부를 집중 관찰하세요.',
          };
        }

        function formatTiltActionKo(tilt) {
          return tilt === 'center'
            ? '정면으로 돌리기'
            : tilt === 'left_30'
              ? '왼쪽 30° 돌리기'
              : '오른쪽 30° 돌리기';
        }

        function formatElapsed(mins) {
          var safe = Math.max(0, Math.round(mins));
          var h = Math.floor(safe / 60);
          var m = safe % 60;
          return String(h).padStart(2, '0') + '시간 ' + String(m).padStart(2, '0') + '분';
        }

        function makeTimestamp() {
          return new Date().toLocaleString('ko-KR', {
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false,
          });
        }

        function formatClockFromElapsed(mins) {
          var total = (BASE_CLOCK_MINUTES + Math.max(0, Math.round(mins))) % (24 * 60);
          var h = Math.floor(total / 60);
          var m = total % 60;
          return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
        }

        function formatClockKorFromElapsed(mins) {
          var total = (BASE_CLOCK_MINUTES + Math.max(0, Math.round(mins))) % (24 * 60);
          var h = Math.floor(total / 60);
          var m = total % 60;
          return h + '시 ' + String(m).padStart(2, '0') + '분';
        }

        function getNextUniqueElapsedFor(pt, minDelta) {
          var ptElapsed = Math.max(0, pt.elapsedMinutes || 0);
          var candidate = ptElapsed + Math.max(1, minDelta);
          var lastPt = pt.history[pt.history.length - 1];
          var lastLabel = lastPt ? lastPt.timeLabel : null;
          if (lastLabel && formatClockFromElapsed(candidate) === lastLabel) {
            candidate += 1;
          }
          return candidate;
        }

        function getEffectiveCriticalAlertFor(pt) {
          var stored = normalizeCriticalAlertState(pt.criticalAlert);
          var vs = evaluatePatientVitalStatus(pt.inputs);
          var elapsed = Math.max(0, pt.elapsedMinutes || 0);
          if (vs.level === 'critical' && stored.stage === 'idle') {
            return Object.assign({}, stored, {
              stage: 'alert_required',
              episodeId: stored.episodeId || ('crit-' + pt.id + '-' + elapsed),
              episodeRiskCategories: getCriticalRiskCategories(pt.inputs),
            });
          }
          return stored;
        }

        function isCriticalPriorityActiveFor(pt) {
          var eff = getEffectiveCriticalAlertFor(pt);
          var vs = evaluatePatientVitalStatus(pt.inputs);
          return (
            eff.stage !== 'resolved' &&
            (eff.stage === 'alert_required' ||
              eff.stage === 'awaiting_order' ||
              eff.stage === 'observing' ||
              eff.stage === 'continuous_observation' ||
              vs.level === 'critical')
          );
        }

        function isDoctorNotifiedFor(pt) {
          var eff = getEffectiveCriticalAlertFor(pt);
          return (
            eff.stage === 'awaiting_order' ||
            eff.stage === 'observing' ||
            eff.stage === 'continuous_observation' ||
            eff.stage === 'resolved'
          );
        }

        function buildShortCriticalReason(pt) {
          var inp = pt.inputs;
          var map = Math.round((inp.sbp + 2 * inp.dbp) / 3);
          var spo2Floor = inp.copdTargetMode ? 85 : 90;
          var parts = [];
          if (inp.hr >= 130 || inp.hr <= 45) parts.push('맥박 ' + inp.hr);
          if (inp.rr >= 30 || inp.rr <= 8) parts.push('호흡 ' + inp.rr);
          if (inp.spo2 <= spo2Floor) parts.push('산소 ' + inp.spo2 + '%');
          if (inp.sbp < 85 || map < 60) parts.push('혈압 ' + inp.sbp + '/' + inp.dbp + '(MAP ' + map + ')');
          if (parts.length > 0) return parts.join(' · ');
          var eff = getEffectiveCriticalAlertFor(pt);
          return eff.doctorOrderNote || evaluatePatientVitalStatus(inp).reasons[0] || '위험 수치 감지';
        }

        function getPatientRepositionMetrics(pt) {
          var elapsed = Math.max(0, pt.elapsedMinutes || 0);
          var start = Math.max(0, Math.min(pt.repositionStartedAtElapsed || 0, elapsed));
          var maintained = Math.max(0, elapsed - start);
          var interval = pt.customRepositionIntervalMin || getDefaultRepositionInterval(pt.inputs);
          var remaining = Math.max(0, interval - maintained);
          var overdue = Math.max(0, maintained - interval);
          var severeThreshold = Math.round(interval * 1.5);
          var isSevereOverride = maintained >= severeThreshold;
          var snoozeLeft = pt.repositionSnoozeMinutesLeft || 0;
          var holdCount = pt.repositionHoldCount || 0;
          var nextCycleTilt = getNextCycleTilt(pt.inputs.lateralTilt, pt.lastSideTilt || 'right_30');
          var isImminent = overdue === 0 && remaining <= 10;

          return {
            elapsed: elapsed,
            start: start,
            maintained: maintained,
            interval: interval,
            remaining: remaining,
            overdue: overdue,
            severeThreshold: severeThreshold,
            isSevereOverride: isSevereOverride,
            snoozeLeft: snoozeLeft,
            holdCount: holdCount,
            nextCycleTilt: nextCycleTilt,
            isImminent: isImminent,
          };
        }

        function buildCriticalPatientAlerts(patients, activePatientId) {
          var items = [];
          for (var i = 0; i < patients.length; i++) {
            var pt = patients[i];
            if (!isCriticalPriorityActiveFor(pt)) continue;
            var eff = getEffectiveCriticalAlertFor(pt);
            var vs = evaluatePatientVitalStatus(pt.inputs);
            var audit = checkAngleAppropriateness(pt.inputs.currentHob, pt.inputs);
            items.push({
              patient: pt,
              effectiveCrit: eff,
              stage: eff.stage === 'idle' ? 'alert_required' : eff.stage,
              vitalReasons: vs.reasons,
              shortReason: buildShortCriticalReason(pt),
              recommendedHob: audit.targetHob,
              recommendedRevTilt: audit.targetRevTilt,
              isDoctorNotified: isDoctorNotifiedFor(pt),
              isSafetyConfirmed: Boolean(eff.safetyChangeConfirmed),
            });
          }

          return items.sort(function (a, b) {
            function rank(s) {
              return s === 'alert_required' ? 0 : s === 'awaiting_order' ? 1 : 2;
            }
            var ra = rank(a.stage);
            var rb = rank(b.stage);
            if (ra !== rb) return ra - rb;
            if (a.patient.id === activePatientId && b.patient.id !== activePatientId) return -1;
            if (b.patient.id === activePatientId && a.patient.id !== activePatientId) return 1;
            return 0;
          });
        }

        function buildNormalAlerts(patients, activePatientId, acknowledgedAngleKeys) {
          var list = [];
          for (var i = 0; i < patients.length; i++) {
            var pt = patients[i];
            var isCritActive = isCriticalPriorityActiveFor(pt);
            var vs = evaluatePatientVitalStatus(pt.inputs);
            var ptMetrics = getPatientRepositionMetrics(pt);
            var ptAudit = checkAngleAppropriateness(pt.inputs.currentHob, pt.inputs);
            var ptHighAngleDue =
              !isCritActive &&
              pt.inputs.currentHob > HIGH_ANGLE_HOB_THRESHOLD &&
              (pt.minutesAbove45 || 0) >= HIGH_ANGLE_LIMIT_MINUTES;

            var activeTie = pt.id === activePatientId ? 0 : 1;

            if (!isCritActive && (ptAudit.isWrongAngle || ptHighAngleDue)) {
              var targetAngle =
                ptHighAngleDue && !ptAudit.isWrongAngle && pt.inputs.rr <= 21 ? 35 : ptAudit.targetHob;
              var hasAngleDiff =
                (ptAudit.targetRevTilt > 0 && pt.inputs.currentHob !== 0) ||
                (ptAudit.targetRevTilt === 0 && targetAngle !== pt.inputs.currentHob);
              var angleKey =
                pt.inputs.currentHob +
                '|' +
                vs.level +
                '|' +
                (ptAudit.targetRevTilt > 0 ? '+' + ptAudit.targetRevTilt : targetAngle);
              if (hasAngleDiff && acknowledgedAngleKeys[pt.id] !== angleKey) {
                list.push({
                  id: 'resp-' + pt.id,
                  patient: pt,
                  category: 'respiratory',
                  tierScore: 30 + activeTie,
                  title: pt.bedNumber + ' ' + pt.patientName + ' · 호흡·각도 조정 필요',
                  summary: ptAudit.decision.ruleConflicts[0] || ptAudit.decision.shortReason,
                  actionLabel:
                    ptAudit.targetRevTilt > 0
                      ? '침대 전체 +' + ptAudit.targetRevTilt + '° 적용'
                      : targetAngle + '° 적용',
                  targetAngle: targetAngle,
                  targetRevTilt: ptAudit.targetRevTilt,
                  targetKnee: ptAudit.targetKneeGatch,
                  angleKey: angleKey,
                });
              }
            }

            if (ptMetrics.maintained >= ptMetrics.interval) {
              if (
                !isCritActive &&
                ptMetrics.snoozeLeft === 0 &&
                ptMetrics.nextCycleTilt !== pt.inputs.lateralTilt
              ) {
                list.push({
                  id: 'rep-' + pt.id,
                  patient: pt,
                  category: 'reposition',
                  tierScore: (ptMetrics.overdue > 0 ? 50 : 60) + activeTie,
                  title:
                    pt.bedNumber +
                    ' ' +
                    pt.patientName +
                    ' · ' +
                    (ptMetrics.overdue > 0 ? '체위변경 지연 ' + ptMetrics.overdue + '분' : '체위변경(몸 돌리기) 필요'),
                  summary: formatTiltKo(pt.inputs.lateralTilt) + ' ' + ptMetrics.maintained + '분 유지 (기준 ' + ptMetrics.interval + '분)',
                  actionLabel: formatTiltActionKo(ptMetrics.nextCycleTilt) + ' 적용',
                  canHoldReposition: true,
                  targetTilt: ptMetrics.nextCycleTilt,
                });
              } else if (
                isCritActive &&
                ptMetrics.isSevereOverride &&
                ptMetrics.snoozeLeft === 0 &&
                ptMetrics.nextCycleTilt !== pt.inputs.lateralTilt
              ) {
                list.push({
                  id: 'rep-severe-' + pt.id,
                  patient: pt,
                  category: 'reposition',
                  tierScore: 45 + activeTie,
                  title: pt.bedNumber + ' ' + pt.patientName + ' · 1.5배 초과 체위변경 필요 (' + ptMetrics.overdue + '분 지연)',
                  summary: '기준 ' + ptMetrics.interval + '분 초과 · 의료진 확인 후 ' + formatTiltKo(ptMetrics.nextCycleTilt) + ' 적용',
                  actionLabel: formatTiltActionKo(ptMetrics.nextCycleTilt) + ' 적용',
                  canHoldReposition: true,
                  isCriticalRepositionOverride: true,
                  targetTilt: ptMetrics.nextCycleTilt,
                });
              } else if (isCritActive) {
                list.push({
                  id: 'rep-delay-notice-' + pt.id,
                  patient: pt,
                  category: 'reposition',
                  tierScore: 80 + activeTie,
                  title: pt.bedNumber + ' ' + pt.patientName + ' · 체위변경 지연 ' + ptMetrics.overdue + '분(의료진 확인 후 처리)',
                  summary: formatTiltKo(pt.inputs.lateralTilt) + ' ' + ptMetrics.maintained + '분 유지 중',
                  isCriticalDelayedNotice: true,
                });
              }
            }
          }

          return list.sort(function (a, b) {
            return a.tierScore - b.tierScore;
          });
        }

        function playCriticalWarningBeep() {
          try {
            var AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            var ctx = new AudioCtx();
            var now = ctx.currentTime;
            function playTone(freq, startOffset, duration) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, now + startOffset);
              gain.gain.setValueAtTime(0.001, now + startOffset);
              gain.gain.exponentialRampToValueAtTime(0.08, now + startOffset + 0.02);
              gain.gain.exponentialRampToValueAtTime(0.001, now + startOffset + duration);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + startOffset);
              osc.stop(now + startOffset + duration + 0.02);
            }
            playTone(880, 0, 0.14);
            playTone(660, 0.16, 0.16);
            window.setTimeout(function () {
              if (ctx && typeof ctx.close === 'function') {
                try { ctx.close(); } catch (e) {}
              }
            }, 500);
          } catch (e) {}
        }

        // =========================================================================
        // 3. APPLICATION STATE, PERSISTENCE & ACTIONS
        // =========================================================================
        function loadPatients() {
          try {
            var saved = localStorage.getItem(STORAGE_PATIENTS_KEY);
            if (saved) {
              var parsed = JSON.parse(saved);
              if (Array.isArray(parsed)) {
                if (parsed.length === 0) return [];
                var valid = parsed.filter(function (p) {
                  return Boolean(p) && typeof p === 'object' && typeof p.id === 'string' && Boolean(p.inputs) && typeof p.inputs === 'object';
                });
                if (valid.length > 0) {
                  var defaultInputs = INITIAL_WARD_PATIENTS[0].inputs;
                  return valid.map(function (p) {
                    var safeInputs = Object.assign({}, defaultInputs, p.inputs);
                    var tilt = safeInputs.lateralTilt || 'center';
                    var lastSide = p.lastSideTilt || (tilt === 'left_30' ? 'left_30' : 'right_30');
                    var elapsed = typeof p.elapsedMinutes === 'number' && p.elapsedMinutes >= 0 ? p.elapsedMinutes : 0;
                    var rawStart = typeof p.repositionStartedAtElapsed === 'number' ? p.repositionStartedAtElapsed : 0;
                    var safeStart = Math.max(0, Math.min(rawStart, elapsed));
                    var safeMaintained = Math.max(0, elapsed - safeStart);
                    return Object.assign({}, p, {
                      inputs: safeInputs,
                      history: Array.isArray(p.history) ? p.history : [],
                      elapsedMinutes: elapsed,
                      repositionStartedAtElapsed: safeStart,
                      minutesSinceReposition: safeMaintained,
                      customRepositionIntervalMin: p.customRepositionIntervalMin !== undefined ? p.customRepositionIntervalMin : null,
                      lastSideTilt: lastSide,
                      repositionProposedForCycle: Boolean(p.repositionProposedForCycle),
                      repositionHoldCount: p.repositionHoldCount || 0,
                      repositionSnoozeMinutesLeft: p.repositionSnoozeMinutesLeft || 0,
                      minutesAbove45: typeof p.minutesAbove45 === 'number' ? p.minutesAbove45 : 0,
                      highAngleProposedForCycle: Boolean(p.highAngleProposedForCycle),
                      criticalAlert: normalizeCriticalAlertState(p.criticalAlert),
                    });
                  });
                }
              }
            }
          } catch (e) {}
          return clone(INITIAL_WARD_PATIENTS);
        }

          // Toast
          toastState: null,
        };

        var toastTimerId = null;
        var timeFlowIntervalId = null;
        var prevUnhandledCritIds = {};
        var lastAutoSelectedId = state.selectedPatientId;
        var lastAutoRecommendedHob = firstRecHob;

        function getActivePatient() {
          if (state.patients.length === 0) return null;
          for (var i = 0; i < state.patients.length; i++) {
            if (state.patients[i].id === state.selectedPatientId) return state.patients[i];
          }
          return state.patients[0];
        }

        function getMissingDefaultPatients() {
          var existingIds = {};
          for (var i = 0; i < state.patients.length; i++) existingIds[state.patients[i].id] = true;
          return INITIAL_WARD_PATIENTS.filter(function (d) { return !existingIds[d.id]; });
        }

        function saveStorage() {
          try { localStorage.setItem(STORAGE_PATIENTS_KEY, JSON.stringify(state.patients)); } catch (e) {}
          try { localStorage.setItem(STORAGE_RECORDS_KEY, JSON.stringify(state.emrRecords)); } catch (e) {}
        }

        function showToast(message, undoOpts) {
          state.toastState = {
            id: Date.now(),
            message: message,
            undoLabel: undoOpts && undoOpts.label ? undoOpts.label : (undoOpts ? '되돌리기' : undefined),
            onUndo: undoOpts ? undoOpts.onUndo : null,
          };
          if (toastTimerId) {
            window.clearTimeout(toastTimerId);
          }
          toastTimerId = window.setTimeout(function () {
            state.toastState = null;
            toastTimerId = null;

        function syncDerivedStateBeforeRender() {
          var activePt = getActivePatient();
          var curId = activePt ? activePt.id : '';
          var curRecHob = activePt ? evaluateBedAngleProtocol(activePt.inputs).recommendedHob : 35;

          if (curId !== lastAutoSelectedId) {
            lastAutoSelectedId = curId;
            state.orderHobInput = null;
            state.lastSimRecoveryBadge = null;
            state.timeFlowPlaying = false;
            state.stoppedByAlertNotice = false;
            if (!activePt) {
              state.recheckPanelOpen = false;
            } else {
              state.recheckInputs = { rr: activePt.inputs.rr, hr: activePt.inputs.hr, spo2: activePt.inputs.spo2 };
              state.tryAngle = activePt.inputs.currentHob;
            }
            state.plannedHobInput = curRecHob;
            lastAutoRecommendedHob = curRecHob;
          } else if (curRecHob !== lastAutoRecommendedHob) {
            state.plannedHobInput = curRecHob;
            lastAutoRecommendedHob = curRecHob;
          }

          var criticalAlerts = buildCriticalPatientAlerts(state.patients, curId);
          var normalAlerts = buildNormalAlerts(state.patients, curId, state.acknowledgedAngleKeys);

          var critMap = {};
          var unhandledMap = {};
          var hasBrandNewCrit = false;
          for (var i = 0; i < criticalAlerts.length; i++) {
            var cId = criticalAlerts[i].patient.id;
            critMap[cId] = true;
            if (criticalAlerts[i].stage === 'alert_required') {
              unhandledMap[cId] = true;
              if (!prevUnhandledCritIds[cId]) hasBrandNewCrit = true;
            }
          }
          prevUnhandledCritIds = unhandledMap;
          if (state.soundEnabled && hasBrandNewCrit) {
            playCriticalWarningBeep();
          }

          var normMap = {};
          for (var j = 0; j < normalAlerts.length; j++) normMap[normalAlerts[j].patient.id] = true;

          if (state.openOrderPatientId && !critMap[state.openOrderPatientId]) state.openOrderPatientId = null;
          if (state.openRecheckPatientId && !critMap[state.openRecheckPatientId]) state.openRecheckPatientId = null;
          if (state.holdTargetPatientId && !normMap[state.holdTargetPatientId]) {
            state.holdTargetPatientId = null;
            state.customHoldReason = '';
          }

          var odKeys = Object.keys(state.orderDrafts);
          for (var k = 0; k < odKeys.length; k++) {
            if (!critMap[odKeys[k]]) delete state.orderDrafts[odKeys[k]];
          }
          var rdKeys = Object.keys(state.recheckDrafts);
          for (var m = 0; m < rdKeys.length; m++) {
            if (!critMap[rdKeys[m]]) delete state.recheckDrafts[rdKeys[m]];
          }

          syncTimeFlowInterval();
          return { activePt: activePt, criticalAlerts: criticalAlerts, normalAlerts: normalAlerts };
        }

        function syncTimeFlowInterval() {
          var activePt = getActivePatient();
          var effCrit = activePt ? getEffectiveCriticalAlertFor(activePt) : DEFAULT_CRITICAL_ALERT_STATE;
          var blocked = effCrit.stage === 'alert_required' || effCrit.stage === 'awaiting_order';
          var shouldRun = Boolean(activePt && state.timeFlowPlaying && !blocked);

          if (!shouldRun) {
            if (timeFlowIntervalId !== null) {
              window.clearInterval(timeFlowIntervalId);
              timeFlowIntervalId = null;
            }
            return;
          }
          if (timeFlowIntervalId === null) {
            timeFlowIntervalId = window.setInterval(function () {
              advanceTimeBy(state.timeSpeed);
            }, 1000);
          }
        }

        function commitAndRender() {
          saveStorage();
          renderApp();
        }

        function updatePatient(updated) {
          state.patients = state.patients.map(function (p) {
            return p.id === updated.id ? updated : p;
          });
        }

        function addEmrRecord(record) {
          var withMs = Object.assign({}, record, { createdAtMs: record.createdAtMs || Date.now() });
          var next = state.emrRecords.slice();
          var foundIdx = -1;
          for (var i = 0; i < next.length; i++) {
            if (next[i].id === withMs.id) { foundIdx = i; break; }
          }
          if (foundIdx >= 0) next[foundIdx] = withMs;
          else next.unshift(withMs);
          state.emrRecords = next;
        }

        function upsertCriticalEpisodeEmrFor(pt, epState, opts) {
          var ptElapsed = Math.max(0, pt.elapsedMinutes || 0);
          var epId = epState.episodeId || ('crit-' + pt.id + '-' + Date.now());
          var firstAlertEntry = epState.timeline[0];
          addEmrRecord({
            id: epId,
            timestamp: makeTimestamp(),
            createdAtMs: Date.now(),
            isPractice: opts.isPractice || undefined,

            lateralTilt: opts.latestInputs.lateralTilt,
            preVitals: {
              rr: opts.preInputs.rr,

              spo2: opts.preInputs.spo2,
              bp: opts.preInputs.sbp + '/' + opts.preInputs.dbp,
            },
            postVitals: epState.timeline.length > 1 ? {
              rr: opts.latestInputs.rr,
              hr: opts.latestInputs.hr,
              spo2: opts.latestInputs.spo2,
              bp: opts.latestInputs.sbp + '/' + opts.latestInputs.dbp,
            } : undefined,
            stabilizationMinutes: 0,
            criticalEpisodeMeta: {
              episodeId: epId,
              startedClock: epState.episodeStartedClock || (firstAlertEntry ? firstAlertEntry.clockLabel : formatClockKorFromElapsed(ptElapsed)),
              statusLabel: opts.statusLabel,
              riskCategories: epState.episodeRiskCategories,
              doctorOrderNote: epState.doctorOrderNote,
              doctorOrderedHob: epState.doctorOrderedHob,
              noImprovementCount: epState.noImprovementCount,
              consecutiveSafeRechecks: epState.consecutiveSafeRechecks,
              seniorEscalationShown: epState.seniorEscalationShown,
              timeline: epState.timeline,
            },

          });
        }

        function upsertRepositionDelayEmrFor(pt, startedAt, maintainedMinutes, intervalMinutes, latestInputs, isCriticalContext, isPractice) {
          var delayMinutes = Math.max(0, maintainedMinutes - intervalMinutes);
          if (delayMinutes <= 0) return;
          var knee = latestInputs.currentHob > 30
            ? (latestInputs.pressureInjuryHighRisk || latestInputs.sacralSkinStatus !== 'intact' ? 15 : 12)
            : 0;
          addEmrRecord({
            id: 'reposition-delay-' + pt.id + '-' + startedAt,
            timestamp: makeTimestamp(),
            createdAtMs: Date.now(),
            isPractice: isPractice || undefined,

            bedNumber: pt.bedNumber,
            patientName: pt.patientName,
            prevHob: latestInputs.currentHob,
            appliedHob: latestInputs.currentHob,
            kneeGatch: knee,
            revTilt: 0,
            lateralTilt: latestInputs.lateralTilt,
            preVitals: {
              rr: latestInputs.rr,
              hr: latestInputs.hr,
              spo2: latestInputs.spo2,
              bp: latestInputs.sbp + '/' + latestInputs.dbp,
            },
            stabilizationMinutes: 0,
            repositionMeta: {
              prevTilt: latestInputs.lateralTilt,
              newTilt: latestInputs.lateralTilt,
              maintainedMinutes: maintainedMinutes,
              isHold: false,
              isDelay: true,
              delayMinutes: delayMinutes,
            },
            verdict: '[체위변경 지연 ' + delayMinutes + '분] ' + formatTiltKo(latestInputs.lateralTilt) + ' ' + maintainedMinutes + '분 유지 (기준 ' + intervalMinutes + '분)' + (isCriticalContext ? ' · 의료진 확인 후 처리 필요' : ''),
          });
        }

        function findPatientById(id) {
          for (var i = 0; i < state.patients.length; i++) {
            if (state.patients[i].id === id) return state.patients[i];
          }
          return null;
        }

        function handleToggleSound() {
          state.soundEnabled = !state.soundEnabled;
          if (state.soundEnabled) {
            var crit = buildCriticalPatientAlerts(state.patients, state.selectedPatientId);
            if (crit.some(function (a) { return a.stage === 'alert_required'; })) {
              playCriticalWarningBeep();
            }
          }
          renderApp();
        }

        function handleToggleSafetyConfirmed(targetPatient, confirmed) {
          var eff = getEffectiveCriticalAlertFor(targetPatient);
          updatePatient(Object.assign({}, targetPatient, {
            criticalAlert: Object.assign({}, eff, { safetyChangeConfirmed: confirmed }),
          }));
          commitAndRender();
        }

        function handleNotifyDoctorCritical(targetPatient, isPractice) {
          var targetInputs = targetPatient.inputs;
          var useElapsed = Math.max(0, targetPatient.elapsedMinutes || 0);
          var clockKor = formatClockKorFromElapsed(useElapsed);
          var elapsedLabel = '+' + formatElapsed(useElapsed) + ' (' + formatClockFromElapsed(useElapsed) + ')';
          var curCrit = getEffectiveCriticalAlertFor(targetPatient);
          var epId = curCrit.episodeId || ('crit-' + targetPatient.id + '-' + Date.now());
          var detectedCats = getCriticalRiskCategories(targetInputs);
          var mergedMap = {};
          var mergedCats = [];
          curCrit.episodeRiskCategories.concat(detectedCats).forEach(function (c) {
            if (!mergedMap[c]) { mergedMap[c] = true; mergedCats.push(c); }
          });
          var vitalSummary = evaluatePatientVitalStatus(targetInputs).reasons.join(', ');
          var vitalSnapStr = '호흡 ' + targetInputs.rr + ' · 맥박 ' + targetInputs.hr + ' · 산소 ' + targetInputs.spo2 + '% · 혈압 ' + targetInputs.sbp + '/' + targetInputs.dbp;
          var isNewCategoryAlert = Boolean(curCrit.newCategoryAlertNote) && curCrit.timeline.length > 0;

          var alertStep = {
            id: 'step-alert-' + Date.now(),
            stepType: 'alert',
            clockLabel: clockKor,
            title: isNewCategoryAlert ? '새 위험 항목 알림 완료' : '의료진 알림 완료',
            detail: isNewCategoryAlert
              ? curCrit.newCategoryAlertNote + ' (' + vitalSummary + ')'
              : '위험 항목(' + (mergedCats.map(formatCriticalCategoryKo).join(', ') || '위험 수치') + ') 보고',
            vitalsSummary: vitalSnapStr,
          };

          var nextStage = isNewCategoryAlert && curCrit.doctorOrderNote ? 'observing' : 'awaiting_order';
          var nextCritState = Object.assign({}, curCrit, {
            stage: nextStage,
            episodeId: epId,
            episodeStartedClock: curCrit.episodeStartedClock || clockKor,
            alertedAtClock: clockKor,
            episodeRiskCategories: mergedCats,
            notifiedSnapshot: curCrit.notifiedSnapshot || {
              rr: targetInputs.rr,
              hr: targetInputs.hr,
              spo2: targetInputs.spo2,
              sbp: targetInputs.sbp,
              dbp: targetInputs.dbp,
            },
            newCategoryAlertNote: undefined,
            timeline: curCrit.timeline.concat([alertStep]),

          var activePt = getActivePatient();
          if (activePt && targetPatient.id === activePt.id) {
            state.recheckInputs = { rr: targetInputs.rr, hr: targetInputs.hr, spo2: targetInputs.spo2 };
            state.orderHobInput = null;
          }

          updatePatient(Object.assign({}, targetPatient, { criticalAlert: nextCritState }));

          var alertLogKey = epId + '-alert';
          var alertMsg = targetPatient.bedNumber + ' ' + clockKor + ' 의료진 알림 완료 → ' + (nextStage === 'awaiting_order' ? '지시·처치 입력 대기' : '처치 중 관찰');
          state.timeEvents = [{
            id: 't-crit-alert-' + Date.now(),
            proposalKey: alertLogKey,
            elapsedLabel: elapsedLabel,
            type: 'critical',
            message: alertMsg,
          }].concat(state.timeEvents.filter(function (e) { return e.proposalKey !== alertLogKey; })).slice(0, 8);

          upsertCriticalEpisodeEmrFor(targetPatient, nextCritState, {
            preInputs: targetInputs,
            latestInputs: targetInputs,
            prevHob: targetInputs.currentHob,
            appliedHob: targetInputs.currentHob,
            statusLabel: nextStage === 'awaiting_order' ? '지시 입력 대기' : '처치 중 관찰',
            verdict: '[1. 의료진 알림 완료 · ' + clockKor + '] ' + vitalSummary,
            isPractice: isPractice,

          showToast(targetPatient.bedNumber + ' ' + targetPatient.patientName + ' · 의료진 알림 완료 및 기록 저장');
          commitAndRender();
        }

        function handleSubmitDoctorOrder(targetPatient, noteRaw, hobOrder, isPractice) {
          var ptInputs = targetPatient.inputs;
          var curCrit = getEffectiveCriticalAlertFor(targetPatient);
          var note = (noteRaw || '').trim() || '산소 투여, 15분 후 재측정';
          var nextElapsed = getNextUniqueElapsedFor(targetPatient, 1);
          var ptStart = Math.max(0, Math.min(targetPatient.repositionStartedAtElapsed || 0, nextElapsed));
          var nextMaintained = Math.max(0, nextElapsed - ptStart);
          var clockKor = formatClockKorFromElapsed(nextElapsed);
          var elapsedLabel = '+' + formatElapsed(nextElapsed) + ' (' + formatClockFromElapsed(nextElapsed) + ')';
          var epId = curCrit.episodeId || ('crit-' + targetPatient.id + '-' + nextElapsed);
          var targetHob = hobOrder !== null && hobOrder !== undefined ? hobOrder : ptInputs.currentHob;
          var hobDesc = hobOrder !== null && hobOrder !== undefined && hobOrder !== ptInputs.currentHob
            ? '각도 ' + ptInputs.currentHob + '° → ' + hobOrder + '° 조절'
            : '현재 각도 ' + ptInputs.currentHob + '° 유지';

          var orderStep = {
            id: 'step-order-' + Date.now(),
            stepType: 'order',
            clockLabel: clockKor,
            title: '의료진 지시·처치 입력',
            detail: note + ' (' + hobDesc + ')',
            vitalsSummary: '호흡 ' + ptInputs.rr + ' · 맥박 ' + ptInputs.hr + ' · 산소 ' + ptInputs.spo2 + '%',
          };

          var nextInputs = Object.assign({}, ptInputs, { currentHob: targetHob });
          var nextCritState = Object.assign({}, curCrit, {
            stage: 'observing',
            episodeId: epId,
            orderEnteredAtClock: clockKor,
            doctorOrderNote: note,
            doctorOrderedHob: hobOrder,
            timeline: curCrit.timeline.concat([orderStep]),
          });

          var activePt = getActivePatient();
          if (activePt && targetPatient.id === activePt.id) {
            state.recheckInputs = { rr: ptInputs.rr, hr: ptInputs.hr, spo2: ptInputs.spo2 };
            state.recheckPanelOpen = true;
          }

          var nextHistory = targetPatient.history;
          if (hobOrder !== null && hobOrder !== undefined && hobOrder !== ptInputs.currentHob) {
            nextHistory = targetPatient.history.slice(-7).concat([{
              timeLabel: formatClockFromElapsed(nextElapsed),
              rr: ptInputs.rr,
              hr: ptInputs.hr,
              hob: targetHob,
              spo2: ptInputs.spo2,
              eventType: 'confirmed',
              eventLabel: '지시 ' + targetHob + '°',

          }

          updatePatient(Object.assign({}, targetPatient, {
            elapsedMinutes: nextElapsed,
            repositionStartedAtElapsed: ptStart,
            minutesSinceReposition: nextMaintained,
            lastRepositionedLabel: formatRepositionAgoLabel(nextMaintained, ptInputs.lateralTilt),
            criticalAlert: nextCritState,
            minutesAbove45: targetHob > HIGH_ANGLE_HOB_THRESHOLD ? targetPatient.minutesAbove45 : 0,
            highAngleProposedForCycle: targetHob > HIGH_ANGLE_HOB_THRESHOLD ? targetPatient.highAngleProposedForCycle : false,
            inputs: nextInputs,
            history: nextHistory,

          state.timeEvents = [{
            id: 't-crit-order-' + Date.now(),
            proposalKey: epId + '-order',
            elapsedLabel: elapsedLabel,
            type: 'confirmed',
            message: '의료진 지시 입력(' + hobDesc + '): ' + note,
          }].concat(state.timeEvents.filter(function (e) { return e.proposalKey !== epId + '-order'; })).slice(0, 8);

          var snapPre = curCrit.notifiedSnapshot ? Object.assign({}, ptInputs, curCrit.notifiedSnapshot) : ptInputs;
          upsertCriticalEpisodeEmrFor(targetPatient, nextCritState, {
            preInputs: snapPre,
            latestInputs: nextInputs,
            prevHob: ptInputs.currentHob,
            appliedHob: targetHob,
            statusLabel: '처치 중 관찰',
            verdict: '[2. 지시 입력 → 처치 중 관찰] ' + note + ' (' + hobDesc + ')',
            isPractice: isPractice,

          showToast(targetPatient.bedNumber + ' ' + targetPatient.patientName + ' · 처치 지시 저장 (관찰 시작)');
          commitAndRender();
        }

        function handleSubmitCriticalRecheck(targetPatient, mode, vitals, isPractice) {
          var ptInputs = targetPatient.inputs;
          var curCrit = getEffectiveCriticalAlertFor(targetPatient);
          var snap = curCrit.notifiedSnapshot || {
            rr: ptInputs.rr,
            hr: ptInputs.hr,
            spo2: ptInputs.spo2,
            sbp: ptInputs.sbp,
            dbp: ptInputs.dbp,
          };

          var nextElapsed = getNextUniqueElapsedFor(targetPatient, 1);
          var ptStart = Math.max(0, Math.min(targetPatient.repositionStartedAtElapsed || 0, nextElapsed));
          var nextMaintained = Math.max(0, nextElapsed - ptStart);
          var clockKor = formatClockKorFromElapsed(nextElapsed);
          var elapsedLabel = '+' + formatElapsed(nextElapsed) + ' (' + formatClockFromElapsed(nextElapsed) + ')';
          var epId = curCrit.episodeId || ('crit-' + targetPatient.id + '-' + nextElapsed);
          var preFull = Object.assign({}, ptInputs, snap);
          var activePt = getActivePatient();

          if (mode === 'unchanged') {
            var sameVitalsStr = '호흡 ' + snap.rr + '회 · 맥박 ' + snap.hr + '회 · 산소 ' + snap.spo2 + '%';
            var unchangedStep = {
              id: 'step-recheck-' + Date.now(),
              stepType: 'recheck',
              clockLabel: clockKor,
              title: '재측정 (변화 없음)',
              detail: '이전 수치와 동일 · 새 알림 없이 관찰 유지',
              vitalsSummary: sameVitalsStr,
            };
            var nextCritUnchanged = Object.assign({}, curCrit, {
              lastRecheckAtClock: clockKor,
              lastOutcome: 'unchanged',
              lastOutcomeDetail: '변화 없음 (' + sameVitalsStr + ')',
              timeline: curCrit.timeline.concat([unchangedStep]),
            });
            if (activePt && targetPatient.id === activePt.id) {
              state.recheckInputs = { rr: snap.rr, hr: snap.hr, spo2: snap.spo2 };
            }
            updatePatient(Object.assign({}, targetPatient, {
              elapsedMinutes: nextElapsed,
              repositionStartedAtElapsed: ptStart,
              minutesSinceReposition: nextMaintained,
              lastRepositionedLabel: formatRepositionAgoLabel(nextMaintained, ptInputs.lateralTilt),
              criticalAlert: nextCritUnchanged,
            }));
            var statusLblUnch = nextCritUnchanged.stage === 'continuous_observation' ? '지시 대기·지속 관찰' : '처치 중 관찰';
            upsertCriticalEpisodeEmrFor(targetPatient, nextCritUnchanged, {
              preInputs: preFull,
              latestInputs: ptInputs,

              appliedHob: ptInputs.currentHob,

              verdict: '[' + statusLblUnch + '] 재측정 변화 없음 (' + sameVitalsStr + ')',
              isPractice: isPractice,
            });
            showToast(targetPatient.bedNumber + ' · 재측정(변화 없음) 기록 완료');
            commitAndRender();
            return;
          }

          var recheckedInputs = Object.assign({}, ptInputs, {
            rr: vitals.rr,
            hr: vitals.hr,
            spo2: vitals.spo2,
          });

          if (curCrit.stage === 'idle' || curCrit.stage === 'resolved') {
            var nextCritCats = getCriticalRiskCategories(recheckedInputs);
            var nextSt = evaluatePatientVitalStatus(recheckedInputs);
            var isCrit = nextSt.level === 'critical';
            var nextCritIdle = isCrit
              ? Object.assign({}, clone(DEFAULT_CRITICAL_ALERT_STATE), {
                  stage: 'alert_required',
                  episodeId: 'crit-' + targetPatient.id + '-' + nextElapsed,
                  episodeStartedClock: clockKor,
                  episodeRiskCategories: nextCritCats,
                })
              : clone(DEFAULT_CRITICAL_ALERT_STATE);
            var hasRisk = ptInputs.pressureInjuryHighRisk || ptInputs.sacralSkinStatus !== 'intact';
            var knee = ptInputs.currentHob > 30 ? (hasRisk ? 15 : 12) : 0;

            updatePatient(Object.assign({}, targetPatient, {
              elapsedMinutes: nextElapsed,
              repositionStartedAtElapsed: ptStart,
              minutesSinceReposition: nextMaintained,
              lastRepositionedLabel: formatRepositionAgoLabel(nextMaintained, ptInputs.lateralTilt),
              criticalAlert: nextCritIdle,
              inputs: recheckedInputs,
              history: targetPatient.history.slice(-7).concat([{
                timeLabel: formatClockFromElapsed(nextElapsed),
                rr: recheckedInputs.rr,
                hr: recheckedInputs.hr,
                hob: ptInputs.currentHob,
                spo2: recheckedInputs.spo2,
                eventType: 'confirmed',
                eventLabel: '재측정',
              }]),
            }));

            addEmrRecord({
              id: 'recheck-' + Date.now(),
              timestamp: makeTimestamp(),
              createdAtMs: Date.now(),
              isPractice: isPractice || undefined,

              bedNumber: targetPatient.bedNumber,
              patientName: targetPatient.patientName,

              appliedHob: ptInputs.currentHob,
              kneeGatch: knee,
              revTilt: 0,
              lateralTilt: ptInputs.lateralTilt,
              preVitals: { rr: ptInputs.rr, hr: ptInputs.hr, spo2: ptInputs.spo2, bp: ptInputs.sbp + '/' + ptInputs.dbp },
              postVitals: { rr: recheckedInputs.rr, hr: recheckedInputs.hr, spo2: recheckedInputs.spo2, bp: ptInputs.sbp + '/' + ptInputs.dbp },
              stabilizationMinutes: 0,

                    nextSbp = Math.max(84, curInputs.sbp - (deltaMin >= 5 ? Math.ceil(deltaMin / 5) : miniStep));
                  }
                } else if (curInputs.currentHob <= 15 && !curInputs.spinalOrHipContraindication) {
                  if (steps > 0) {
                    nextRr = Math.min(31, curInputs.rr + Math.ceil(deltaMin / 10));
                    nextHr = Math.min(132, curInputs.hr + Math.ceil(deltaMin / 12));
                    nextSpo2 = Math.max(88, curInputs.spo2 - Math.max(1, Math.floor(deltaMin / 15)));
                    nextBorg = Math.min(8, curInputs.borgScore + Math.max(1, Math.floor(deltaMin / 15)));
                  } else if (miniStep > 0) {
                    nextRr = Math.min(31, curInputs.rr + miniStep);
                    nextHr = Math.min(132, curInputs.hr + miniStep);
                    if (crossed15 > 0) {
                      nextSpo2 = Math.max(88, curInputs.spo2 - crossed15);
                      nextBorg = Math.min(8, curInputs.borgScore + crossed15);
                    }
                  }
                } else if (curInputs.currentHob >= 30 && curInputs.currentHob < 60) {
                  if (curInputs.rr > 18) nextRr = Math.max(18, curInputs.rr - (steps > 0 ? steps : miniStep));
                  if (curInputs.hr > 82) nextHr = Math.max(80, curInputs.hr - (steps > 0 ? 3 * steps : miniStep));
                  var targetSpo2Mid = curInputs.copdTargetMode ? 91 : 97;
                  if (curInputs.spo2 < targetSpo2Mid) nextSpo2 = Math.min(targetSpo2Mid, curInputs.spo2 + (steps > 0 ? steps : miniStep));
                  if (curInputs.sbp < 110) {
                    nextSbp = Math.min(118, curInputs.sbp + (steps > 0 ? 4 * steps : miniStep));
                    nextDbp = Math.min(74, curInputs.dbp + (steps > 0 ? 2 * steps : miniStep));
                  }
                  if (borgStep > 0) nextBorg = Math.max(2, curInputs.borgScore - borgStep);
                }
                simulatedRecoveryApplied = nextRr !== curInputs.rr || nextHr !== curInputs.hr || nextSpo2 !== curInputs.spo2 || nextSbp !== curInputs.sbp;
              }
            }
          }

          var simulatedInputs = Object.assign({}, curInputs, {
            rr: nextRr,
            hr: nextHr,
            spo2: nextSpo2,
            sbp: nextSbp,
            dbp: nextDbp,
            borgScore: nextBorg,
          });

          var audit = checkAngleAppropriateness(curInputs.currentHob, simulatedInputs);
          var nextCats = getCriticalRiskCategories(simulatedInputs);
          var nextCritState = curCrit;
          var newCriticalTriggered = false;

          if (simulatedRecoveryApplied) {
            state.recheckInputs = { rr: nextRr, hr: nextHr, spo2: nextSpo2 };
            state.lastSimRecoveryBadge = '가상 변화: 호흡 ' + curInputs.rr + '→' + nextRr + ' · 맥박 ' + curInputs.hr + '→' + nextHr + ' · 산소 ' + curInputs.spo2 + '→' + nextSpo2 + '%';
          }

          if (isEpisodeActive) {
            var brandNewCats = nextCats.filter(function (c) { return curCrit.episodeRiskCategories.indexOf(c) === -1; });
            if (brandNewCats.length > 0) {
              newCriticalTriggered = true;
              var mMap = {};
              var mArr = [];
              curCrit.episodeRiskCategories.concat(brandNewCats).forEach(function (c) { if (!mMap[c]) { mMap[c] = true; mArr.push(c); } });
              nextCritState = Object.assign({}, curCrit, {
                stage: 'alert_required',
                episodeRiskCategories: mArr,
                newCategoryAlertNote: '새 위험 항목 추가: ' + brandNewCats.map(formatCriticalCategoryKo).join(', '),
              });
            }
          } else if (audit.decision.vitalStatus.level === 'critical') {
            newCriticalTriggered = true;
            nextCritState = Object.assign({}, clone(DEFAULT_CRITICAL_ALERT_STATE), {
              stage: 'alert_required',
              episodeId: 'crit-' + activePatient.id + '-' + nextElapsed,
              episodeStartedClock: formatClockKorFromElapsed(nextElapsed),
              episodeRiskCategories: nextCats,
            });
          } else if (curCrit.stage === 'resolved') {
            nextCritState = clone(DEFAULT_CRITICAL_ALERT_STATE);
          }

          var isCriticalBlocking = nextCritState.stage !== 'resolved' &&
            (nextCritState.stage === 'alert_required' ||
              nextCritState.stage === 'awaiting_order' ||
              nextCritState.stage === 'observing' ||
              nextCritState.stage === 'continuous_observation' ||
              audit.decision.vitalStatus.level === 'critical');

          var curInterval = activePatient.customRepositionIntervalMin || getDefaultRepositionInterval(curInputs);
          var nextDelayMinutes = Math.max(0, nextMinutesSinceReposition - curInterval);
          if (nextDelayMinutes > 0) {
            upsertRepositionDelayEmrFor(activePatient, ptStart, nextMinutesSinceReposition, curInterval, simulatedInputs, isCriticalBlocking, markPractice);
          }

          var wasProposedReposition = Boolean(activePatient.repositionProposedForCycle);
          var severeThreshold = Math.round(curInterval * 1.5);
          var triggeredThisTick = nextMinutesSinceReposition >= curInterval && nextSnooze === 0 && (!isCriticalBlocking || nextMinutesSinceReposition >= severeThreshold);

          var highAngleDue = !isCriticalBlocking && curInputs.currentHob > HIGH_ANGLE_HOB_THRESHOLD && nextMinutesAbove45 >= HIGH_ANGLE_LIMIT_MINUTES && !activePatient.highAngleProposedForCycle;
          var nextTargetAngle = highAngleDue && !audit.isWrongAngle && simulatedInputs.rr <= 21 ? 35 : audit.targetHob;
          var nextHasAngleDiff = (audit.targetRevTilt > 0 && simulatedInputs.currentHob !== 0) || (audit.targetRevTilt === 0 && nextTargetAngle !== simulatedInputs.currentHob);
          var nextAngleKey = simulatedInputs.currentHob + '|' + audit.decision.vitalStatus.level + '|' + (audit.targetRevTilt > 0 ? '+' + audit.targetRevTilt : nextTargetAngle);
          var nextRespAlertKey = !isCriticalBlocking && (audit.isWrongAngle || highAngleDue) && nextHasAngleDiff && state.acknowledgedAngleKeys[activePatient.id] !== nextAngleKey ? nextAngleKey : null;
          var newRespAlertTriggered = nextRespAlertKey !== null && nextRespAlertKey !== prevRespAlertKey;

          if (newCriticalTriggered || newRespAlertTriggered) {
            if (state.timeFlowPlaying) state.stoppedByAlertNotice = true;
            state.timeFlowPlaying = false;
          }

          if (triggeredThisTick && !wasProposedReposition) {
            state.timeEvents = [{
              id: 't-rep-' + Date.now(),

              type: 'pressure',
              message: activePatient.bedNumber + ' 체위변경(몸 돌리기) 기준 ' + curInterval + '분 도달 → ' + formatTiltKo(getNextCycleTilt(curInputs.lateralTilt, activePatient.lastSideTilt || 'right_30')),
            }].concat(state.timeEvents).slice(0, 8);

          updatePatient(Object.assign({}, activePatient, {
            elapsedMinutes: nextElapsed,
            repositionStartedAtElapsed: ptStart,
            minutesSinceReposition: nextMinutesSinceReposition,
            lastRepositionedLabel: formatRepositionAgoLabel(nextMinutesSinceReposition, curInputs.lateralTilt),
            repositionProposedForCycle: wasProposedReposition || triggeredThisTick,
            repositionSnoozeMinutesLeft: nextSnooze,
            minutesAbove45: nextMinutesAbove45,
            highAngleProposedForCycle: curInputs.currentHob > HIGH_ANGLE_HOB_THRESHOLD ? (activePatient.highAngleProposedForCycle || highAngleDue) : false,

            }]),
          }));

          if (isPractice) {
            showToast(activePatient.bedNumber + ' · 시간 +' + deltaMin + '분 경과 (누적 ' + nextElapsed + '분)');

            if (prevPatients[i].id === target.id) { deletedIndex = i; break; }
          }
          var remainingPatients = prevPatients.filter(function (p) { return p.id !== target.id; });
          var wasSelected = activePt && target.id === activePt.id;
          var nextSelectedId = wasSelected
            ? (remainingPatients.length > 0 ? remainingPatients[Math.min(Math.max(0, deletedIndex), remainingPatients.length - 1)].id : '')

        function renderBedAngleVisualizer(opts) {
          var currentHobAngle = opts.currentHobAngle;
          var hobAngle = opts.hobAngle;

          var legRaiseDeg = opts.legRaiseDeg;

          var hipX = 270;
          var hipY = 205;
          var backrestLen = 128;
          var thighLen = 78;
          var calfLen = 84;
          function rad(deg) { return (deg * Math.PI) / 180; }
          var effectiveHob = tripodSupport ? 82 : hobAngle;

          var curBackEndX = hipX - backrestLen * Math.cos(rad(currentHobAngle));
          var curBackEndY = hipY - backrestLen * Math.sin(rad(currentHobAngle));
          var effectiveKnee = legRaiseDeg > 0 ? legRaiseDeg : kneeGatchDeg;
          var kneeX = hipX + thighLen * Math.cos(rad(effectiveKnee));
          var kneeY = hipY - thighLen * Math.sin(rad(effectiveKnee));
          var footX = legRaiseDeg > 0 ? kneeX + calfLen * Math.cos(rad(legRaiseDeg)) : kneeX + calfLen;
          var footY = legRaiseDeg > 0 ? kneeY - calfLen * Math.sin(rad(legRaiseDeg)) : kneeY + (effectiveKnee > 0 ? 10 : 0);

          var accentColor = severity === 'critical' ? '#DC2626' : (severity === 'caution' ? '#D97706' : '#2563EB');
          var diaphragmLabel = reverseTrendelenburgDeg > 0
            ? '허리는 펴고 침대 전체를 기울여 숨쉬기 편하게 함'
            : effectiveHob >= 60
              ? '폐가 가장 넓게 열림 · 어지러움 주의'
              : effectiveHob >= 30
                ? '숨쉬기 가장 편하고 역류를 막는 표준 자세'
                : effectiveHob >= 15

              ? (isSelected ? 'bg-red-50/40 border-red-600 ring-2 ring-red-500/40' : 'bg-red-50/20 border-red-500 hover:border-red-600')

        var focusKeyToRestore = null;
        var focusSelStart = null;
        var focusSelEnd = null;

        function captureActiveFocus() {
          var el = document.activeElement;
          if (!el || !el.getAttribute) {
            focusKeyToRestore = null;
            return;
          }
          var fk = el.getAttribute('data-focus-key');
          if (!fk) {
            focusKeyToRestore = null;
            return;
          }
          focusKeyToRestore = fk;
          if (el.tagName === 'INPUT' && (el.type === 'text' || el.type === 'search')) {
            focusSelStart = el.selectionStart;
            focusSelEnd = el.selectionEnd;
          } else {
            focusSelStart = null;
            focusSelEnd = null;
          }
        }

        function restoreCapturedFocus() {
          if (!focusKeyToRestore) return;
          var target = document.querySelector('[data-focus-key="' + focusKeyToRestore.replace(/"/g, '\\"') + '"]');
          if (!target) {
            focusKeyToRestore = null;
            return;
          }
          if (document.activeElement !== target) {
            target.focus({ preventScroll: true });
          }
          if (focusSelStart !== null && target.tagName === 'INPUT' && (target.type === 'text' || target.type === 'search')) {
            try {
              target.setSelectionRange(focusSelStart, focusSelEnd);
            } catch (e) {}
          }
          focusKeyToRestore = null;
        }

          if (Math.abs(nextBottom - state.bottomBarHeight) > 1) {

        function downloadCsv(records) {
          var header = ['시간', '병실', '환자명', '이전각도', '적용각도', '무릎받침', '돌아눕기', '이전생체징후', '최근생체징후', '판정요약'];
          var rows = records.map(function (r) {
            return [
              r.timestamp,
              r.bedNumber,
              r.patientName + (r.patientDeleted ? '(삭제됨)' : ''),
              r.prevHob + '도',
              r.revTilt > 0 ? '침대전체 +' + r.revTilt + '도' : r.appliedHob + '도',
              r.kneeGatch + '도',
              formatTiltKo(r.lateralTilt),
              'RR ' + r.preVitals.rr + ' / HR ' + r.preVitals.hr + ' / SpO2 ' + r.preVitals.spo2 + '% / BP ' + r.preVitals.bp,
              r.postVitals ? 'RR ' + r.postVitals.rr + ' / HR ' + r.postVitals.hr + ' / SpO2 ' + r.postVitals.spo2 + '% / BP ' + r.postVitals.bp : '진행/관찰 중',
              r.verdict,
            ];
          });
          var csv = [header].concat(rows).map(function (row) {
            return row.map(function (cell) { return '"' + String(cell).replace(/"/g, '""') + '"'; }).join(',');
          }).join('\n');
          var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = 'SBPP_간호기록_' + new Date().toISOString().slice(0, 10) + '.csv';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }

        function clampNum(val, mn, mx, fallback) {
          var n = Number(val);
          if (isNaN(n)) return fallback;
          return Math.max(mn, Math.min(mx, Math.round(n)));
        }

        var appEl = document.getElementById('app');

        appEl.addEventListener('click', function (e) {
          var targetEl = e.target;
          if (!targetEl) return;

          // Backdrop click inside practice drawer closes drawer
          if (targetEl.getAttribute && targetEl.getAttribute('data-action') === 'practice-backdrop') {
            state.practiceOpen = false;
            renderApp();
            return;
          }

          var btn = targetEl.closest ? targetEl.closest('[data-action]') : null;
          if (!btn) return;
          var action = btn.getAttribute('data-action');
          if (!action || btn.disabled) return;

          var activePt = getActivePatient();
          var pid = btn.getAttribute('data-patient-id');
          var targetPt = pid ? findPatientById(pid) : activePt;

          switch (action) {
            case 'nav-tab':
              state.activeTab = btn.getAttribute('data-tab') || 'workspace';
              renderApp();
              break;

            case 'open-new-bed':
              state.isNewBedOpen = true;
              renderApp();
              break;

            case 'close-new-bed':
              state.isNewBedOpen = false;
              renderApp();
              break;

            case 'toggle-sound':
              handleToggleSound();
              break;

            case 'alert-select-patient':
              if (pid) {
                state.selectedPatientId = pid;
                state.activeTab = 'workspace';
                renderApp();
              }
              break;

            case 'alert-select-patient-close-stack':
              if (pid) {
                state.selectedPatientId = pid;
                state.activeTab = 'workspace';
                state.normalStackOpen = false;
                renderApp();
              }
              break;

            case 'notify-doctor':
              if (targetPt) handleNotifyDoctorCritical(targetPt);
              break;

            case 'toggle-alert-order':
              if (targetPt) {
                var recHob = Number(btn.getAttribute('data-rec-hob'));
                if (!state.orderDrafts[targetPt.id]) {
                  state.orderDrafts[targetPt.id] = {
                    note: '산소 투여, 15분 후 재측정',
                    hob: isNaN(recHob) ? null : recHob,
                  };
                }
                state.openOrderPatientId = state.openOrderPatientId === targetPt.id ? null : targetPt.id;
                state.openRecheckPatientId = null;
                renderApp();
              }
              break;

            case 'alert-order-demo':
              if (targetPt) {
                var demoHob = Number(btn.getAttribute('data-rec-hob'));
                state.orderDrafts[targetPt.id] = {
                  note: '산소 투여, 15분 후 재측정',
                  hob: isNaN(demoHob) ? null : demoHob,
                };
                renderApp();
              }
              break;

            case 'alert-order-hob':
              if (targetPt) {
                var rawHob = btn.getAttribute('data-hob');
                var curDraft = state.orderDrafts[targetPt.id] || { note: '산소 투여, 15분 후 재측정', hob: null };
                state.orderDrafts[targetPt.id] = {
                  note: curDraft.note,
                  hob: rawHob === '' || rawHob === null ? null : Number(rawHob),
                };
                renderApp();
              }
              break;

            case 'alert-order-submit':
              if (targetPt) {
                var subDraft = state.orderDrafts[targetPt.id] || { note: '산소 투여, 15분 후 재측정', hob: null };
                handleSubmitDoctorOrder(targetPt, subDraft.note, subDraft.hob);
                state.openOrderPatientId = null;
                renderApp();
              }
              break;

            case 'apply-critical-rec-angle':
              if (targetPt) {
                var aHob = Number(btn.getAttribute('data-hob') || 0);
                var aRev = Number(btn.getAttribute('data-rev') || 0);
                handleApplyAngleForPatient(targetPt, aHob, aRev, undefined, { allowUndo: true });
              }
              break;

            case 'toggle-alert-recheck':
              if (targetPt) {
                state.recheckDrafts[targetPt.id] = {
                  rr: targetPt.inputs.rr,
                  hr: targetPt.inputs.hr,
                  spo2: targetPt.inputs.spo2,
                };
                state.openRecheckPatientId = state.openRecheckPatientId === targetPt.id ? null : targetPt.id;
                state.openOrderPatientId = null;
                renderApp();
              }
              break;

            case 'alert-recheck-submit':
              if (targetPt) {
                var rMode = btn.getAttribute('data-mode') === 'unchanged' ? 'unchanged' : 'manual';
                var rDraft = state.recheckDrafts[targetPt.id] || {
                  rr: targetPt.inputs.rr,
                  hr: targetPt.inputs.hr,
                  spo2: targetPt.inputs.spo2,
                };
                handleSubmitCriticalRecheck(targetPt, rMode, rDraft);
                state.openRecheckPatientId = null;
                renderApp();
              }
              break;

            case 'toggle-show-all-crit':
              state.showAllCritical = !state.showAllCritical;
              renderApp();
              break;

            case 'apply-top-normal-alert': {
              var alertId = btn.getAttribute('data-alert-id');
              var allNormals = buildNormalAlerts(state.patients, activePt ? activePt.id : '', state.acknowledgedAngleKeys);
              var foundNorm = null;
              for (var i = 0; i < allNormals.length; i++) {
                if (allNormals[i].id === alertId) { foundNorm = allNormals[i]; break; }
              }
              if (foundNorm) {
                if (foundNorm.category === 'reposition' && foundNorm.targetTilt) {
                  applyLateralTiltForPatient(
                    foundNorm.patient,
                    foundNorm.targetTilt,
                    foundNorm.isCriticalRepositionOverride ? '의료진 확인 후 지연 체위변경' : '상단 제안 적용'
                  );
                } else if (foundNorm.category === 'respiratory') {
                  handleApplyAngleForPatient(
                    foundNorm.patient,
                    foundNorm.targetHob !== undefined ? foundNorm.targetHob : foundNorm.patient.inputs.currentHob,
                    foundNorm.targetRevTilt || 0,
                    foundNorm.angleKey,
                    { allowUndo: true }
                  );
                }
              }
              break;
            }

            case 'toggle-hold-reposition':
              if (targetPt) {
                state.holdTargetPatientId = state.holdTargetPatientId === targetPt.id ? null : targetPt.id;
                renderApp();
              }
              break;

            case 'submit-hold-chip':

            case 'ack-normal-angle':

                state.acknowledgedAngleKeys = Object.assign({}, state.acknowledgedAngleKeys);
                state.acknowledgedAngleKeys[pid] = btn.getAttribute('data-angle-key') || '';
                renderApp();
              }
              break;

            case 'toggle-normal-stack':
              state.normalStackOpen = !state.normalStackOpen;
              renderApp();
              break;

            case 'apply-stacked-reposition':
              if (targetPt) {
                var sTilt = btn.getAttribute('data-tilt');
                var isOv = btn.getAttribute('data-crit-override') === '1';
                if (sTilt) {
                  applyLateralTiltForPatient(targetPt, sTilt, isOv ? '의료진 확인 후 지연 체위변경' : '알림 목록 적용');
                  state.normalStackOpen = false;
                  renderApp();
                }
              }
              break;

            // Workspace actions
            case 'restore-defaults':
              handleRestoreDefaultPatients();
              break;

            case 'ws-order-demo':
              if (activePt) {
                var wsRec = evaluateBedAngleProtocol(activePt.inputs).recommendedHob;

              var wHob = btn.getAttribute('data-hob');
              state.orderHobInput = wHob === '' || wHob === null ? null : Number(wHob);
              renderApp();
              break;
            }

            case 'ws-order-submit':
              if (activePt) {
                handleSubmitDoctorOrder(activePt, state.orderNoteInput, state.orderHobInput, state.practiceOpen);
              }
              break;

            case 'ack-senior-escalation':
              if (activePt) {
                var curC = getEffectiveCriticalAlertFor(activePt);
                updatePatient(Object.assign({}, activePt, {
                  criticalAlert: Object.assign({}, curC, { seniorEscalationAcknowledged: true }),
                }));
                commitAndRender();
              }
              break;

            case 'close-recheck-panel':
              state.recheckPanelOpen = false;
              renderApp();
              break;

            case 'ws-recheck-submit':
              if (activePt) {
                var wm = btn.getAttribute('data-mode') === 'unchanged' ? 'unchanged' : 'manual';
                handleSubmitCriticalRecheck(activePt, wm, state.recheckInputs);
              }
              break;

            case 'confirm-critical-resolved':
              if (activePt) {
                updatePatient(Object.assign({}, activePt, { criticalAlert: clone(DEFAULT_CRITICAL_ALERT_STATE) }));
                commitAndRender();
              }
              break;

            case 'select-patient':
              if (pid) {
                state.selectedPatientId = pid;
                state.openCardMenuId = null;
                renderApp();
              }
              break;

            case 'toggle-card-menu':
              if (pid) {
                state.openCardMenuId = state.openCardMenuId === pid ? null : pid;
                renderApp();
              }
              break;

            case 'request-delete-patient':
              if (targetPt) {
                state.openCardMenuId = null;
                state.deleteWithRecords = false;
                state.deleteTargetPatient = targetPt;
                renderApp();
              }
              break;

            case 'cancel-delete':
              state.deleteTargetPatient = null;
              state.deleteWithRecords = false;

              break;

              state.virtualMode = !state.virtualMode;

            case 'toggle-time-flow':
              if (activePt) {
                var eff = getEffectiveCriticalAlertFor(activePt);
                var blk = eff.stage === 'alert_required' || eff.stage === 'awaiting_order';
                if (!blk) {
                  if (!state.timeFlowPlaying) state.stoppedByAlertNotice = false;
                  state.timeFlowPlaying = !state.timeFlowPlaying;

              state.timeSpeed = Number(btn.getAttribute('data-speed') || 10);
